[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epflemma-agent"
version = "0.3.0"
description = "EPFLemma is a Lean AI for Math shell shipped through the standalone epflemma CLI and native runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EPFLemma contributors" }]
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.39.0",
  "fire",
  "httpx",
  "jinja2",
  "lean-probe>=0.3.0,<0.4",
  "openai",
  "prompt_toolkit",
  "pydantic>=2.0",
  "python-dotenv",
  "pyyaml",
  "requests",
  "rich",
  "ruamel.yaml>=0.18.10",
  "tenacity",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "mcp>=1.2.0", "ruff>=0.6", "mypy>=1.11"]
mcp = ["mcp>=1.2.0"]
pty = [
  "ptyprocess>=0.7.0; sys_platform != 'win32'",
  "pywinpty>=2.0.0; sys_platform == 'win32'",
]
web = ["firecrawl-py"]
lean-explore = ["lean-explore[local]"]
local-vllm = ["vllm>=0.8.0"]
all = [
  "epflemma-agent[dev]",
  "epflemma-agent[mcp]",
  "epflemma-agent[pty]",
  "epflemma-agent[web]",
  "epflemma-agent[lean-explore]",
]

[project.scripts]
epflemma = "epflemma_cli.main:main"
epflemma-agent = "epflemma_agent:main"

[tool.setuptools]
py-modules = [
  "gauss_constants",
  "gauss_state",
  "gauss_time",
  "minisweagent_path",
  "model_tools",
  "epflemma_agent",
  "run_agent",
  "toolsets",
  "utils",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "epflemma_cli", "tools", "tools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Lenient initial ruleset for the refactor. Enforces import-sorting and high-signal
# pyflakes checks (undefined names, redefinitions, f-string misuse) — the safe, mechanical
# wins. The unused-import / unused-variable sweeps are DEFERRED to Phase 6:
#   F401 (unused-import): this codebase re-exports module-level imports as patch targets /
#         dynamic-access points without __all__ (e.g. tools.terminal_tool._interrupt_event),
#         so blanket auto-removal silently breaks runtime + tests. Must be done per-file with
#         __all__ / `# noqa: F401` annotations.
#   F841 (unused-variable): ~40 occurrences, not safely auto-fixable (may hide bugs).
select = ["F", "I"]
ignore = ["F401", "F841"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
ignore_missing_imports = true
# Incremental gate: ONLY these files are type-checked. The list grows each phase as
# modules are extracted/cleaned. mypy needs explicit targets — overrides alone do not select.
files = [
  "gauss_constants.py",
  "utils.py",
  "agent/log_formatting.py",
  "agent/command_safety.py",
  "tools/response.py",
  "agent/managed_run.py",
  "epflemma_cli/native_config.py",
  "epflemma_cli/lean_diagnostics.py",
  "epflemma_cli/lean_parsing.py",
  "epflemma_cli/native_state.py",
  "epflemma_cli/queue_edit_guard.py",
  "epflemma_cli/formalization_document_runner.py",
  "epflemma_cli/manager_verification.py",
  "epflemma_cli/native_utils.py",
  "epflemma_cli/project_prove_manager.py",
  "epflemma_cli/cli_handlers.py",
]
