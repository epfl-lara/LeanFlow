[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epflemma-agent"
version = "0.3.0"
description = "EPFLemma is a Lean AI for Math shell shipped through the standalone epflemma CLI and native runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EPFLemma contributors" }]
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.39.0",
  "fire",
  "httpx",
  "jinja2",
  "lean-interact",
  "openai",
  "prompt_toolkit",
  "pydantic>=2.0",
  "python-dotenv",
  "pyyaml",
  "requests",
  "rich",
  "ruamel.yaml>=0.18.10",
  "tenacity",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "mcp>=1.2.0"]
mcp = ["mcp>=1.2.0"]
pty = [
  "ptyprocess>=0.7.0; sys_platform != 'win32'",
  "pywinpty>=2.0.0; sys_platform == 'win32'",
]
web = ["firecrawl-py"]
lean-explore = ["lean-explore[local]"]
local-vllm = ["vllm>=0.8.0"]
all = [
  "epflemma-agent[dev]",
  "epflemma-agent[mcp]",
  "epflemma-agent[pty]",
  "epflemma-agent[web]",
  "epflemma-agent[lean-explore]",
]

[project.scripts]
epflemma = "epflemma_cli.main:main"
epflemma-agent = "epflemma_agent:main"

[tool.setuptools]
py-modules = [
  "gauss_constants",
  "gauss_state",
  "gauss_time",
  "minisweagent_path",
  "model_tools",
  "epflemma_agent",
  "run_agent",
  "toolsets",
  "utils",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "epflemma_cli", "tools", "tools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"
