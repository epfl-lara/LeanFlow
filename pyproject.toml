[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leanflow-agent"
version = "0.3.0"
description = "Lean-first AI automation for verified proving and mathematical formalization."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LeanFlow contributors" }]
license = { text = "Apache-2.0" }
dependencies = [
  "httpx",
  "lean-probe>=0.4.1.dev0,<0.5",
  "prompt_toolkit",
  "pydantic>=2.0",
  "python-dotenv",
  "pyyaml",
  "requests",
  "rich",
  "ruamel.yaml>=0.18.10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "mcp>=1.2.0,<2", "black>=24", "ruff>=0.6", "mypy>=1.11", "setuptools>=61,<82", "wheel"]
mcp = ["mcp>=1.2.0,<2"]
pty = [
  "ptyprocess>=0.7.0; sys_platform != 'win32'",
  "pywinpty>=2.0.0; sys_platform == 'win32'",
]
web = ["firecrawl-py"]
lean-explore = ["lean-explore[local]"]
all = [
  "leanflow-agent[dev]",
  "leanflow-agent[mcp]",
  "leanflow-agent[pty]",
  "leanflow-agent[web]",
  "leanflow-agent[lean-explore]",
]

[project.scripts]
leanflow = "leanflow_cli.main:main"

[tool.uv.sources]
# Coordinated development lock; replace with the registry at companion release.
lean-probe = { path = "../LeanProbe" }

[tool.setuptools]
py-modules = [
  "leanflow_agent",
  "run_agent",
  "model_tools",
  "toolsets",
  "utils",
]

[tool.setuptools.packages.find]
include = [
  "agent",
  "agent.*",
  "core",
  "core.*",
  "leanflow_cli",
  "leanflow_cli.*",
  "tools",
  "tools.*",
  "leanflow_skills",
  "leanflow_specs",
]

[tool.setuptools.package-data]
leanflow_skills = ["**/*.md"]
leanflow_specs = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored / third-party trees we never lint or format (Lean toolchain caches, mathlib test
# fixtures, opt-in security skill scripts, both project venvs).
extend-exclude = [
    "testdata",
    "optional-skills",
    "**/.lake/**",
    ".venv",
    ".leanflow-venv",
]

# Black is the code formatter (https://github.com/psf/black). Run `black .` before committing;
# CI runs `black --check .`. Ruff is used for linting + import-sorting only, not formatting.
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''/(testdata|optional-skills|\.venv|\.leanflow-venv|.*/\.lake)/'''

[tool.ruff.lint]
# select = the enforced rule families: pyflakes (F — undefined names, redefinitions, f-string
# misuse), import-sorting (I), and pyupgrade (UP — PEP585/604 modernization). Run `ruff check .`.
select = ["F", "I", "UP"]
# F401 (unused-import) is ENFORCED: genuinely-dead imports must be removed. The few deliberate
#   re-exports / dynamic-access points that ruff cannot see (such as terminal_tool._interrupt_event
#   and leaf-module public re-exports) each carry an explicit `# noqa: F401`.
# F841 (unused-variable): a handful of occurrences, not safely auto-fixable (may hide bugs).
# UP035/UP022/UP042: behavior-sensitive manual modernizations (StrEnum, subprocess capture_output).
ignore = ["F841", "UP035", "UP022", "UP042"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
ignore_missing_imports = true
no_site_packages = true
# Check maintained executable scripts under their distinct file identities.
scripts_are_modules = true
# Incremental gate: ONLY these files are type-checked. The list grows each phase as
# modules are extracted/cleaned. mypy needs explicit targets — overrides alone do not select.
