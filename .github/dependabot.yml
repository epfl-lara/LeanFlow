# Grouped weekly lockfile refreshes so Dependabot security alerts do not pile up
# between manual `uv lock --upgrade` / `npm update` passes. CI, the installer,
# and the sandbox container all resolve from pyproject.toml / package.json, so
# these PRs mainly keep the pinned snapshots current.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    ignore:
      # Keep types aligned with the minimum supported VS Code version.
      - dependency-name: "@types/vscode"
      # Compiler APIs and renderer instrumentation need an explicit migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
