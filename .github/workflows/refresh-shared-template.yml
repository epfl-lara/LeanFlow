name: Publish Shared Template

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: refresh-shared-template-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-leanflow-template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEVBOX_TEMPLATE_BASE_URL: https://devbox.svc.cloud.morph.so
      TEMPLATE_ALIAS: leanflow
      TEMPLATE_FILE: .github/morph/leanflow-template.yaml
      PYTHONUNBUFFERED: "1"
      MORPH_API_KEY: ${{ secrets.MORPH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check shared-template configuration
        id: template-configuration
        run: |
          if [ -z "${MORPH_API_KEY}" ]; then
            echo "Shared-template publishing skipped: MORPH_API_KEY is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "${TEMPLATE_FILE}" ]; then
            echo "Tracked Morph template file is missing: ${TEMPLATE_FILE}" >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Publish shared template alias
        if: steps.template-configuration.outputs.enabled == 'true'
        run: python3 scripts/publish_shared_template.py
