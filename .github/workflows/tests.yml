name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LeanFlow
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: LeanFlow

      - name: Checkout pinned LeanProbe companion
        uses: actions/checkout@v4
        with:
          repository: epfl-lara/LeanProbe
          ref: 0252843eae96cd24601dc999626d5f262337d221
          path: LeanProbe

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      # --- Fast gate: format + lint + types run before the (slower) test suite ---
      - name: Black format check
        run: |
          source .venv/bin/activate
          black --check .

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Mypy (gated module set)
        run: |
          source .venv/bin/activate
          mypy

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --ignore=tests/integration --tb=short -n auto
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install extension dependencies
        run: npm ci
      - name: Type-check extension
        run: npm run typecheck
      - name: Test extension
        run: npm test
      - name: Package extension
        run: npm run package
