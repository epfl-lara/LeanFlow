name = "lean_imo_bench"
version = "0.1.0"
defaultTargets = ["LeanIMOBench"]

# No [leanOptions] block on purpose. Upstream verified these statements as
# standalone `import Mathlib` files under Lean/Mathlib 4.27.0 with default
# elaboration options; overriding autoImplicit or linter settings here could
# change how a statement elaborates and would break comparability.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "a3a10db0e9d66acbebf76c5e6a135066525ac900"

[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "0e9e6e2962ab0a51440513d9ee028c8aa66bb53b"

# Every problem is its own module so it can be built and proved independently.
# The glob makes each one an addressable Lake target:
#   lake build LeanIMOBench.Basic.PBBasic001
[[lean_lib]]
name = "LeanIMOBench"
globs = ["LeanIMOBench.+"]
